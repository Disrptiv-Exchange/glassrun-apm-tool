name-template: "v$NEXT_PATCH_VERSION"
tag-template: "v$NEXT_PATCH_VERSION"
template: |
  ## What’s new
  $CHANGES

  ### Full diff
  https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...$NEXT_TAG

categories:
  - title: "🚀 Features"
    labels: ["feature", "enhancement"]
  - title: "🐛 Fixes"
    labels: ["bug", "fix"]
  - title: "🧰 Maintenance"
    labels: ["chore", "refactor", "deps"]
change-template: "- $TITLE (#$NUMBER) by @$AUTHOR"
no-changes-template: "- No user-facing changes."

exclude-labels:
  - "skip-changelog"
