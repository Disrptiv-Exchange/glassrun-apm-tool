name: Guard QA allowed sources

on:
  pull_request:
    branches: [ "qa" ]   # Only when PR targets qa

jobs:
  allow-only-dev-or-hotfix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate source branch
        shell: bash
        run: |
          SRC="${{ github.head_ref }}"
          echo "Source branch: $SRC"

          # Allowed: exactly 'dev'
          if [[ "$SRC" == "dev" ]]; then
            echo "✅ Allowed: dev → qa"
            exit 0
          fi

          # Allowed: JIRA hotfix like GR-6790-hotfix
          # ^GR-<digits>-hotfix$ (adjust GR to your project key(s) if needed)
          if [[ "$SRC" =~ ^GR-[0-9]+-hotfix$ ]]; then
            echo "✅ Allowed: hotfix '${SRC}' → qa"
            exit 0
          fi

          echo "::error title=Blocked merge into qa::Only 'dev' or JIRA hotfix branches (e.g., GR-6790-hotfix) may be merged into 'qa'. Got '${SRC}'."
          exit 1
